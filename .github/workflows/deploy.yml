name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astrostore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django>=5.2,<6.2"
      - name: Run tests
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-test-secret-not-for-production
          DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
        run: python manage.py test account catalog commerce payments storefront --verbosity=1
